appId: io.example.expoSdk54Todo
---
- clearState
- launchApp

- tapOn:
    id: 'add-todo-input'
- inputText: 'delete me'
- tapOn:
    id: 'add-todo-submit'

- assertVisible: 'delete me'

# Swipe the row from right to reveal the Delete action.
# Earlier draft tried `id: "todo-text-${output.todoId}"` but that
# requires a prior `runFlow` that defines `output.todoId`, which we
# never had. Caught by maestro-flow-lint.sh. Use the visible text
# as the swipe anchor — there's only one row at this point.
- swipe:
    from: 'delete me'
    direction: LEFT

- tapOn: 'Delete'

- assertNotVisible: 'delete me'
- assertVisible:
    id: 'empty-state'
