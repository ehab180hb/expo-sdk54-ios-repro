name: Maestro E2E

# Runs after a successful iOS build. Maestro replays the YAML flows in
# e2e/flows/ against the booted simulator with the .app installed.
#
# Slowest pipeline tier (~5-10 min) — only run on PRs and master.

on:
  workflow_run:
    workflows: ['iOS Sim Build (cached)']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      # NOTE: cache key shapes MUST match ios-build-cached.yml exactly,
      # otherwise restore-keys will hit the wrong layer (or no layer)
      # and we'll do a full cold rebuild here instead of restoring.
      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-pods-

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ios/derived
          key: ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.js', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.json') }}-
            ${{ runner.os }}-derived-

      - name: Restore .expo cache
        uses: actions/cache@v4
        with:
          path: .expo
          key: ${{ runner.os }}-expo-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Build (incremental from cache)
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          xcodebuild -workspace "$WORKSPACE" -scheme exposdk54todo \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath ./derived \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tail -100

      - name: Boot sim + install app
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 1[5-9] Pro" \
                   | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find ios/derived -name "*.app" -type d -maxdepth 8 | head -1)
          /usr/bin/codesign --force --sign - --deep "$APP"
          xcrun simctl install "$DEVICE" "$APP"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro flows
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          # The original form was `maestro test ... || true` — same
          # anti-pattern as the xcodebuild masking we fixed in
          # ios-build-cached.yml. It made the workflow green even
          # when 3/4 flows failed (verified on run 25254367321:
          # complete-todo + delete-todo + persistence all silently
          # failing). Now: capture the RC, surface artifacts, and
          # let the workflow fail if Maestro itself failed.
          set +e
          maestro test e2e/flows/ --format junit --output maestro-report.xml
          MAESTRO_RC=$?
          set -e
          echo "::notice::maestro exit code = $MAESTRO_RC"
          if [ "$MAESTRO_RC" != "0" ]; then
            echo "::error::One or more Maestro flows failed (RC=$MAESTRO_RC). See maestro-report.xml in the artifact."
            # Don't `exit $MAESTRO_RC` yet — let the upload step run.
            # The final `exit` is after the upload (see step ordering).
            echo "MAESTRO_RC=$MAESTRO_RC" >> $GITHUB_ENV
          fi

      - name: Hermes crash canary
        # Plan 4 T4.3.J. Greps the simulator's syslog for any
        # Hermes runtime exceptions surfaced during E2E. Hermes
        # ABI mismatches (bytecode vs runtime) don't fail the JS
        # bundler — they only show up at runtime. Catching them
        # here saves the "tests passed but app crashed on first
        # launch in TestFlight" loop.
        if: always()
        run: |
          if [ -z "${DEVICE:-}" ]; then
            echo "::warning::DEVICE unset — skipping Hermes canary"
            exit 0
          fi
          # Pull last ~5 min of process logs and grep. simctl spawn
          # log may produce zero output if no matching events
          # occurred — failure here is informational, not a gate.
          xcrun simctl spawn "$DEVICE" log show --last 5m --style compact \
            --predicate 'process == "exposdk54todo" OR eventMessage CONTAINS "Hermes" OR eventMessage CONTAINS "JSError"' \
            > /tmp/hermes-canary.txt 2>&1 \
            || true # advisory: see comment above
          if grep -E "HermesNativeCrash|HermesCompilationError|hermesInternal.*Error|Uncaught.*Error" /tmp/hermes-canary.txt > /tmp/hermes-hits.txt; then
            echo "::error::Hermes runtime exception detected during E2E"
            cat /tmp/hermes-hits.txt
            exit 1
          fi
          echo "✓ no Hermes exceptions surfaced"

      - name: Upload report + recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/*.png
            ~/.maestro/tests/**/*.mp4
            /tmp/hermes-canary.txt
            /tmp/hermes-hits.txt
          retention-days: 14

      - name: Fail if Maestro flows failed
        if: env.MAESTRO_RC != '' && env.MAESTRO_RC != '0'
        run: |
          echo "::error::Maestro flows failed (RC=$MAESTRO_RC) — see uploaded maestro-e2e artifact for the JUnit report and per-flow screenshots."
          exit "$MAESTRO_RC"
