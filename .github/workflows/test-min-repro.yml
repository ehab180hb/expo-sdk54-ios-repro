name: iOS Minimal Repro

# Recovery v4 step A2 done as a fully-scripted workflow.
# Builds a minimal Expo SDK 54 app with the same flagging deps as
# mondid-finance-mobile, runs it on the iPhone 1x Pro simulator with
# Release configuration (so the JS bundle is embedded — no Metro
# needed), ad-hoc codesigns, installs, captures Hermes stack +
# simctl log stream + a screenshot, uploads everything as an artifact.
#
# Lessons baked in (from the manual tmate dry-run on 2026-05-01):
# - ls -d *.xcworkspace (without -d, ls expands the dir contents)
# - codesign --force --sign - (Xcode 16 simctl install rejects unsigned .app)
# - Configuration=Release (so the JS bundle is bundled into the .app)
#
# The verdict (boots / crashes-same / crashes-differently) tells us
# whether the bug is in the dep stack or in mondid-specific code.
#
# Trigger:
#   gh workflow run ios-min-repro.yml --repo ehab180hb/cosmoland-front
#
# Read the result:
#   gh run download <id> --repo ehab180hb/cosmoland-front --name ios-min-repro

on:
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: 'Seconds of log capture after launch'
        required: false
        default: '45'
        type: string

jobs:
  min-repro:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Show environment
        run: |
          uname -a
          xcode-select -p
          xcodebuild -version | head -2
          node --version || true
          xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create minimal Expo SDK 54 app
        run: |
          # Use a dir under /Users/runner — NOT /tmp — to dodge the
          # macOS /tmp -> /private/tmp symlink that confuses Metro's
          # resolver (it normalizes some paths via realpath but not
          # others, so the bundler sees /tmp/.../index.ts as missing
          # even when it exists at /private/tmp/.../index.ts).
          mkdir -p /Users/runner/work/scratch
          cd /Users/runner/work/scratch
          rm -rf mondid-min
          npx create-expo-app@latest mondid-min --template blank-typescript --no-install
          cd mondid-min
          # Pin Expo SDK 54 explicitly to match the real app.
          jq '.dependencies.expo = "~54.0.34" | .dependencies.react = "19.1.0" | .dependencies["react-native"] = "0.81.5"' package.json > package.json.tmp
          mv package.json.tmp package.json
          npm install --legacy-peer-deps

      - name: Add suspect deps + babel plugin
        run: |
          cd /Users/runner/work/scratch/mondid-min
          # The exact same flagging dep set from mondid-finance-mobile.
          npm install --legacy-peer-deps \
            react-native-unistyles@~3.2 \
            react-native-nitro-modules@^0.35 \
            react-native-edge-to-edge@^1.8 \
            react-native-reanimated@~4.1 \
            react-native-worklets@0.5.1 \
            @react-native/normalize-colors@0.81.5 \
            react-native-gesture-handler@~2.28 \
            expo-build-properties \
            expo-secure-store \
            expo-web-browser \
            expo-haptics
          # Babel plugin for worklets compilation.
          cat > babel.config.js <<'EOF'
          module.exports = function (api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"],
              plugins: ["react-native-worklets/plugin"],
            };
          };
          EOF
          # Minimal App.tsx that exercises the same import order as the real app.
          cat > App.tsx <<'EOF'
          import "react-native-gesture-handler";
          import { StyleSheet } from "react-native-unistyles";

          // Configure Unistyles with a trivial theme so the call shape
          // matches the real app's @repo/tokens/unistyles.
          StyleSheet.configure({
            themes: { light: { colors: { bg: "#fff", fg: "#111" } } },
            settings: { initialTheme: "light" },
          });

          import * as React from "react";
          import { Text, View } from "react-native";

          export default function App() {
            return (
              <View style={{ flex: 1, alignItems: "center", justifyContent: "center" }}>
                <Text style={{ fontSize: 32 }}>HELLO mondid-min</Text>
                <Text style={{ marginTop: 12, color: "#666" }}>boot OK</Text>
              </View>
            );
          }
          EOF
          # Mark the bundle id so we can launch by id later.
          jq '.expo.ios = { bundleIdentifier: "io.mondid.min" } | .expo.scheme = "mondidmin" | .expo.plugins = ["expo-secure-store","expo-web-browser"]' app.json > app.json.tmp
          mv app.json.tmp app.json
          # Ensure entry point exists. package.json says main=index.ts;
          # create-expo-app SDK 54 template no longer includes one (the
          # bundler error from prior run was: "Unable to resolve module
          # /Users/runner/work/scratch/mondid-min/index.ts"). Write the standard Expo root
          # component registration boilerplate.
          cat > index.ts <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF
          ls -la index.ts App.tsx package.json

      - name: Expo prebuild iOS + pod install
        run: |
          cd /Users/runner/work/scratch/mondid-min
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install --repo-update 2>&1 | tee pod-install.log | tail -50

      - name: Xcodebuild Release (embeds JS bundle so we exercise the dep stack without Metro)
        run: |
          cd /Users/runner/work/scratch/mondid-min/ios
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # Schemes are listed alphabetically by xcodebuild -list, and the
          # FIRST one is "EXConstants" (a pod), not "mondidmin" (the app).
          # Building the EXConstants scheme silently succeeds with no .app.
          # Hardcode the app scheme — it always matches the bundle id slug.
          SCHEME="mondidmin"
          echo "Workspace=$WORKSPACE Scheme=$SCHEME"
          # Sanity check the scheme exists
          if ! xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -qE "^\s+${SCHEME}\s*$"; then
            echo "::error::Scheme $SCHEME not found in workspace $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list 2>&1 | head -50
            exit 1
          fi
          # Use ad-hoc CODE_SIGN_IDENTITY="-" so the Embed Pods Frameworks
          # build phase actually runs (CODE_SIGNING_ALLOWED=NO suppresses
          # framework embedding for Release config — confirmed by prior
          # run dyld error: "Library not loaded: @rpath/React.framework/React").
          # Two-step (matches ios-build-cached.yml pattern):
          # 1. xcodebuild → tee → done. RC captured via PIPESTATUS.
          # 2. grep on the saved log file as a SEPARATE non-failing op.
          # The previous form mixed both into `tee | grep ... || true`
          # which made it possible (under some bash modes) for the
          # `|| true` to intercept BEFORE PIPESTATUS captured the
          # xcodebuild RC. lint-ci-masks.sh flagged this in our own repo.
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build \
            2>&1 | tee xcodebuild.log
          XCB_RC=${PIPESTATUS[0]}
          # Surface the most useful log lines for the workflow log.
          grep -E '^(\*\*|error:|warning: ld|fatal|Touch |Ld |CodeSign |/tmp.*\.app|BUILD)' xcodebuild.log | tail -100 || true
          echo "xcodebuild RC=$XCB_RC"
          if [ "$XCB_RC" != "0" ]; then
            echo "::error::xcodebuild failed (rc=$XCB_RC)"
            echo "--- error/FAILED lines ---"
            grep -E "error:|FAILED|fatal" xcodebuild.log | tail -50
            echo "--- last 100 lines of full log ---"
            tail -100 xcodebuild.log
            exit 1
          fi
          # Belt-and-suspenders: even if xcodebuild rc=0, .app must exist.
          if [ -z "$(find derived -name '*.app' -type d 2>/dev/null | head -1)" ]; then
            echo "::error::xcodebuild rc=0 but produced no .app"
            tail -50 xcodebuild.log
            exit 1
          fi
          echo "Built: $(find derived -name '*.app' -type d 2>/dev/null | head -1)"

      - name: Boot iPhone 15/16/17 Pro sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 1[5-9] Pro" | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 1[5-9]" | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          fi
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE" || echo "(already booted)"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Inspect built .app
        run: |
          cd /Users/runner/work/scratch/mondid-min/ios
          APP=$(find derived -name "*.app" -type d -maxdepth 8 | head -1)
          echo "APP=$APP"
          echo "--- top-level ---"
          ls -la "$APP"
          echo "--- Frameworks ---"
          ls -la "$APP/Frameworks/" || echo "(no Frameworks dir)"
          echo "--- main.jsbundle ---"
          ls -la "$APP/main.jsbundle" || echo "(no main.jsbundle)"
          wc -c "$APP/main.jsbundle" 2>/dev/null || true
          echo "--- _CodeSignature (already signed by xcodebuild?) ---"
          ls -la "$APP/_CodeSignature/" || echo "(no _CodeSignature)"

      - name: Codesign .app (ad-hoc, required for simctl install on Xcode 16)
        run: |
          cd /Users/runner/work/scratch/mondid-min/ios
          APP=$(find derived -name "*.app" -type d -maxdepth 8 | head -1)
          echo "Codesigning $APP"
          # Sign the main app deeply (covers Frameworks/* automatically).
          /usr/bin/codesign --force --sign - --deep "$APP"
          /usr/bin/codesign --verify --verbose=2 "$APP"
          ls -la "$APP/_CodeSignature/" || true

      - name: Install + launch + capture logs
        run: |
          cd /Users/runner/work/scratch/mondid-min/ios
          APP=$(find derived -name "*.app" -type d -maxdepth 8 | head -1)
          echo "Installing $APP onto $DEVICE"
          xcrun simctl install "$DEVICE" "$APP"
          # Verify install succeeded.
          xcrun simctl get_app_container "$DEVICE" io.mondid.min app
          # Broad predicate: catch our app's own logs PLUS SpringBoard/CoreSimulator
          # messages about it (which is where early-crash exit codes show up before
          # the app itself can NSLog anything).
          xcrun simctl spawn "$DEVICE" log stream \
            --level debug \
            --style syslog \
            --predicate 'process == "mondidmin" OR eventMessage CONTAINS "mondidmin" OR eventMessage CONTAINS "io.mondid.min"' \
            > /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>&1 &
          echo $! > /tmp/log.pid
          sleep 2
          # Launch with --console-pty so stdout/stderr (where Hermes
          # writes JS exceptions) come back to us.
          xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" "io.mondid.min" \
            > /Users/runner/work/scratch/mondid-min/launch-console.txt 2>&1 &
          echo $! > /tmp/launch.pid
          sleep ${{ inputs.capture_seconds }}
          kill $(cat /tmp/launch.pid) 2>/dev/null || true
          kill $(cat /tmp/log.pid) 2>/dev/null || true
          sleep 1

      - name: Screenshot
        if: always()
        run: |
          xcrun simctl io "$DEVICE" screenshot /Users/runner/work/scratch/mondid-min/screenshot.png || true
          ls -la /Users/runner/work/scratch/mondid-min/screenshot.png || true

      - name: Verdict report
        if: always()
        run: |
          REPORT=/Users/runner/work/scratch/mondid-min/VERDICT.txt
          echo "=== mondid-min verdict $(date -u) ===" > $REPORT
          echo >> $REPORT
          echo "--- launch-console.txt ---" >> $REPORT
          cat /Users/runner/work/scratch/mondid-min/launch-console.txt >> $REPORT 2>/dev/null || echo "(empty)" >> $REPORT
          echo >> $REPORT
          echo "--- log-stream errors ---" >> $REPORT
          grep -iE 'error|exception|unhandled|TypeError|Invariant|HostFunction|Hermes|Nitro|Worklets|Unistyles|fatal|RCTFatal|abort|SIGABRT' /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>/dev/null \
            | grep -v 'level=info' | head -100 >> $REPORT
          echo >> $REPORT
          echo "--- log-stream tail (200 lines) ---" >> $REPORT
          tail -200 /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>/dev/null >> $REPORT
          echo >> $REPORT
          echo "--- VERDICT ---" >> $REPORT
          if grep -q 'HELLO mondid-min' /Users/runner/work/scratch/mondid-min/launch-console.txt 2>/dev/null || \
             grep -q 'HELLO mondid-min' /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>/dev/null; then
            echo "BOOTED — minimal repro shows HELLO. Dep stack is fine; bug is in app code." >> $REPORT
          elif grep -qE 'Object is not a function|TypeError' /Users/runner/work/scratch/mondid-min/launch-console.txt 2>/dev/null || \
               grep -qE 'Object is not a function|TypeError' /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>/dev/null; then
            echo "CRASH_SAME — same TypeError/runtime-not-ready as EAS build. Bug is in dep stack." >> $REPORT
          elif grep -qE 'RCTFatal|Invariant|abort\(\)|fatal' /Users/runner/work/scratch/mondid-min/full-log-stream.txt 2>/dev/null; then
            echo "CRASH_DIFFERENT — minimal repro crashes, but with a different signature." >> $REPORT
          else
            echo "UNKNOWN — neither HELLO nor a clear crash signature. Inspect logs+screenshot." >> $REPORT
          fi
          echo
          echo "════ INLINE VERDICT ════"
          head -200 $REPORT

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-min-repro
          path: |
            /Users/runner/work/scratch/mondid-min/launch-console.txt
            /Users/runner/work/scratch/mondid-min/full-log-stream.txt
            /Users/runner/work/scratch/mondid-min/VERDICT.txt
            /Users/runner/work/scratch/mondid-min/screenshot.png
            /Users/runner/work/scratch/mondid-min/ios/xcodebuild.log
            /Users/runner/work/scratch/mondid-min/ios/pod-install.log
            /Users/runner/work/scratch/mondid-min/package.json
            /Users/runner/work/scratch/mondid-min/babel.config.js
            /Users/runner/work/scratch/mondid-min/App.tsx
          retention-days: 7
