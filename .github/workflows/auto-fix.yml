name: Auto-fix lint + format

# Plan 4 T4.5.G. On every PR: if `prettier --write` or `eslint --fix`
# would produce changes, auto-commit them as a `chore: lint fixes`
# commit on the PR branch. Saves the human round-trip of "CI
# failed → run prettier locally → push again".
#
# Only runs on pull_request events from the SAME repo (no forks)
# to avoid the security risk of writing back to a fork's branch
# from a workflow with elevated permissions.

on:
  pull_request:
    branches: [master]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - '**.md'
      - '**.yml'
      - '**.yaml'

permissions:
  contents: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    # Skip on forks — pushing back requires write access we don't grant
    # to fork PRs. Internal PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Run prettier + eslint --fix
        # advisory: prettier --write may exit non-zero if no files match the glob. eslint --fix exits non-zero when un-auto-fixable issues remain — we still want the auto-fixable ones applied.
        run: |
          npx prettier --write '**/*.{ts,tsx,json,md,yml,yaml}' \
            --ignore-path .gitignore \
            || true # advisory: see step comment
          npx eslint --fix --cache \
            --cache-location node_modules/.cache/eslint/ \
            'src/**/*.{ts,tsx}' 'App.tsx' '__tests__/**/*.{ts,tsx}' \
            || true # advisory: see step comment

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "✓ no auto-fixable changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-fix lint + format

          Generated by .github/workflows/auto-fix.yml (Plan 4 T4.5.G)
          on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          git push
