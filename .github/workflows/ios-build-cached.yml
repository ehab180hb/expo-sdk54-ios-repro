name: iOS Sim Build (cached)

# Production build verifier. Cold builds are 12+ minutes; with caches
# warm, subsequent builds are 2-4 minutes. Caches:
#  - node_modules (npm cache)
#  - ios/Pods (CocoaPods)
#  - ios/derived (Xcode DerivedData)
#  - ~/Library/Caches/CocoaPods (CocoaPods global cache)
#
# This is the "real iteration loop" workflow once the dep stack is stable.
# For a from-scratch dep-stack regression test, see test-min-repro.yml.

on:
  push:
    branches: [master]
    # NATIVE-config inputs only. JS edits go through js-only-fast.yml
    # (which restores the .app from this workflow's cache and only
    # re-bundles the JS — ~90s vs ~5min). src/**, index.ts, App.tsx
    # are deliberately NOT in this list.
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - 'ios/Podfile.lock'
      - '.github/workflows/ios-build-cached.yml'
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: 'Seconds to keep app running before screenshot'
        required: false
        default: '30'
        type: string

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          # Hash on Podfile.lock (the actual native dep manifest) +
          # package-lock.json (for cases when Podfile.lock isn't present
          # yet on a fresh clone). app.json was a poor signal because
          # whitespace edits would bust an otherwise-valid Pods cache.
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-pods-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ios/derived
          # CRITICAL: do NOT include src/** here — every JS edit would
          # blow this cache, defeating the point. The app's binary is
          # stable as long as native config is. JS changes flow through
          # js-only-fast.yml's bundle-only path.
          key: ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.js', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.json') }}-
            ${{ runner.os }}-derived-

      - name: Cache .expo
        uses: actions/cache@v4
        with:
          path: .expo
          # Saves ~10-15s per run on the prebuild artifact regen.
          key: ${{ runner.os }}-expo-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Expo prebuild + pod install
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install --repo-update 2>&1 | tee pod-install.log | tail -50

      - name: Xcodebuild Release
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="exposdk54todo"
          # Two-step: tee to log, then grep separately. The previous form
          # was `tee | grep || true` — but `|| true` swallows the pipefail
          # signal AND resets PIPESTATUS, so xcodebuild errors got masked.
          # The new form runs xcodebuild→tee as one pipeline whose exit
          # code IS xcodebuild's RC (via pipefail), then runs grep on the
          # log file as a separate non-failing operation.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build \
            2>&1 | tee xcodebuild.log
          XCB_RC=${PIPESTATUS[0]}
          # Surface the most useful lines for the workflow log.
          grep -E '^(\*\*|error:|warning: ld|fatal|Touch |Ld |CodeSign |BUILD)' xcodebuild.log | tail -100 || true
          if [ "$XCB_RC" != "0" ]; then
            echo "::error::xcodebuild rc=$XCB_RC"
            grep -E "error:|FAILED|fatal" xcodebuild.log | tail -50
            exit 1
          fi
          [ -n "$(find derived -name '*.app' -type d 2>/dev/null | head -1)" ] \
            || { echo "::error::no .app produced"; exit 1; }

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 1[5-9] Pro" \
                   | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Inspect .app pre-codesign
        run: |
          cd ios
          APP=$(find derived -name "*.app" -type d -maxdepth 8 | head -1)
          echo "APP=$APP"
          echo "--- top-level ---"
          ls -la "$APP"
          echo "--- Info.plist ---"
          if [ -f "$APP/Info.plist" ]; then
            plutil -p "$APP/Info.plist" | head -30
          else
            echo "::error::Info.plist MISSING"
          fi
          echo "--- main exe ---"
          plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>&1
          EXE=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>/dev/null)
          file "$APP/$EXE" 2>&1
          echo "--- Frameworks ---"
          ls -la "$APP/Frameworks/" 2>&1 || echo "(no Frameworks)"
          echo "--- _CodeSignature (xcodebuild ad-hoc?) ---"
          ls -la "$APP/_CodeSignature/" 2>&1 || echo "(no _CodeSignature)"

      - name: Codesign + install + launch
        run: |
          cd ios
          APP=$(find derived -name "*.app" -type d -maxdepth 8 | head -1)
          # Sign frameworks one-by-one (skip any unsignable), then top-level.
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP/Frameworks"/*; do
              [ -e "$fw" ] || continue
              /usr/bin/codesign --force --sign - "$fw" \
                || echo "::warning::skipped codesign for $fw"
            done
          fi
          /usr/bin/codesign --force --sign - "$APP" \
            || echo "::warning::top-level codesign failed; trying simctl install anyway"
          /usr/bin/codesign --verify --verbose=2 "$APP" 2>&1 || true
          xcrun simctl install "$DEVICE" "$APP"

          xcrun simctl spawn "$DEVICE" log stream \
            --level debug --style syslog \
            --predicate 'process == "exposdk54todo" OR eventMessage CONTAINS "exposdk54todo" OR eventMessage CONTAINS "io.example.expoSdk54Todo"' \
            > /tmp/full-log-stream.txt 2>&1 &
          LOG_PID=$!
          sleep 2

          xcrun simctl launch --console-pty --terminate-running-process \
            "$DEVICE" "io.example.expoSdk54Todo" \
            > /tmp/launch-console.txt 2>&1 &
          LPID=$!

          sleep ${{ inputs.capture_seconds || 30 }}
          kill $LPID $LOG_PID 2>/dev/null || true

      - name: Screenshot
        if: always()
        run: |
          xcrun simctl io "$DEVICE" screenshot /tmp/screenshot.png || true

      - name: Stage .app for fast-path cache
        if: success()
        run: |
          mkdir -p pre-built-app
          APP=$(find ios/derived -name "*.app" -type d -maxdepth 8 | head -1)
          cp -R "$APP" pre-built-app/

      - name: Save .app to fast-path cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: pre-built-app/
          # Same key shape js-only-fast.yml expects (NATIVE inputs only).
          # When this workflow finishes successfully, the next js-only-fast
          # PR run will be a cache hit and complete in ~90 seconds.
          key: pre-built-app-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.js') }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-cached
          path: |
            /tmp/launch-console.txt
            /tmp/full-log-stream.txt
            /tmp/screenshot.png
            ios/xcodebuild.log
            ios/pod-install.log
          retention-days: 14
