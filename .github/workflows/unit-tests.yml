name: Unit Tests

# The fast feedback layer. Runs on every push + PR.
# Linux runner — no Xcode needed. ~30s end-to-end including npm install
# (with cache hit ~10s).

on:
  push:
    branches: [master]
    # Plan 4 T4.4.C: skip docs-only / config-only / template-only
    # changes. Saves ~30s per such commit and keeps the unit-tests
    # signal meaningful (it actually changed something).
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '_explorer-runs/**'
      - 'docs/POST_MORTEMS/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '_explorer-runs/**'
      - 'docs/POST_MORTEMS/**'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage -- --maxWorkers=2

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
